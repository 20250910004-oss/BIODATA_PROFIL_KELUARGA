<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Web | Dhika Muhamad Fhikri</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .hero-text {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 1s ease;
        }

        .hero-text h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .hero-text p {
            font-size: 1.1rem;
            color: #94a3b8;
        }

        .hero-text span { color: #60a5fa; }
        
        .card-container {
            display: flex;
            gap: 30px;
            animation: fadeInUp 1s ease;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px;
            width: 320px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.1);
            border-color: #60a5fa;
            box-shadow: 0 20px 40px rgba(96, 165, 250, 0.2);
        }

        .card-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: inline-block;
            transition: transform 0.4s ease;
        }

        .card:hover .card-icon { transform: scale(1.1) rotate(5deg); }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .card-desc {
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.6;
        }
        
        @keyframes fadeInDown {
            0% { opacity: 0; transform: translateY(-30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    
    <div class="hero-text">
        <h1>Portal Web <span>Dhika.</span></h1>
        <p>Silakan pilih destinasi halaman yang ingin Anda kunjungi.</p>
    </div>
    
    <div class="card-container">
        
        <a href="BIODATA/BIODATA_DIRI.html" class="card">
            <div class="card-icon">👨🏻‍💻</div>
            <div class="card-title">Profil Pribadi</div>
            <div class="card-desc">Jelajahi portofolio, riwayat pendidikan, dan pengalaman profesional saya.</div>
        </a>
        
        
        <a href="PROFIL_KELUARGA/profile_keluarga_1.html" class="card">
            <div class="card-icon">🏡</div>
            <div class="card-title">Profil Keluarga</div>
            <div class="card-desc">Kenali lebih dekat silsilah dan cerita hangat dari keluarga besar Bu Dhika.</div>
        </a>
    </div>

</body>
</html>
